[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rait-toolkit"
version = "0.5.0"
description = "MCP server for D.Y. Patil RAIT students — MyDy (Moodle) LMS and UniClaIRE portal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "requests>=2.32",
    "mcp>=1.28.1",
]

[project.scripts]
rait-toolkit = "rait_toolkit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["rait_toolkit"]

[tool.hatch.build]
include = [
    "rait_toolkit/**",
]
