[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lms-buddy"
version = "0.5.0"
description = "MCP server for the MyDy (Moodle) LMS at D.Y. Patil institutions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "requests>=2.32",
    "mcp>=1.0.0",
]

[project.scripts]
lms-buddy = "lms_buddy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["lms_buddy"]

[tool.hatch.build]
include = [
    "lms_buddy/**",
]
